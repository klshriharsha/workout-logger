# Supabase local development config. Generated by `supabase init` and trimmed to the parts
# this project actually uses. Full reference: https://supabase.com/docs/guides/local-development/cli/config
#
# `project_id` names the local Docker stack only. The hosted project is chosen at deploy time
# via `supabase link --project-ref <ref>` (see supabase/README.md), never hard-coded here.
project_id = "workout-logger"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Must match the major version of the hosted project (Dashboard -> Settings -> Infrastructure).
major_version = 17

# Migrations in `migrations/` are applied in filename order by `db reset` / `migration up` /
# `db push`. `seed.sql` then runs on `db reset` only.
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

# Accounts and sessions live in the app's own tables (public.users, public.sessions), not in
# Supabase Auth. Auth stays enabled only because the hosted project always runs it: its schema
# provides auth.uid(), which the Row Level Security policies read. No email is ever sent.
# Realtime and Storage aren't used, so those stacks stay disabled.
[auth]
enabled = true
site_url = "http://localhost:3000"

[realtime]
enabled = false

[storage]
enabled = false

[analytics]
enabled = false
